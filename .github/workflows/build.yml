name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86:
    name: LWJGL ${{ matrix.lwjgl }} natives, linux-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # 3.4.1: Minecraft 26.1.x and 26.2 (GLFW). 3.4.3: Minecraft 26.3 (SDL3, VMA).
        lwjgl: ['3.4.1', '3.4.3']
    env:
      LWJGL_VERSION: ${{ matrix.lwjgl }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources (pinned commits + patches/)
        run: ./fetch.sh

      - name: Build container image
        run: podman build -t lwjgl-x86-build -f Containerfile .

      - name: Build natives
        run: ./build.sh

      - name: Build natives, i686 flavour (no SSE/SSE2)
        run: LWJGL_X86_FLAVOUR=i686 ./build.sh

      - name: Build natives, i586 flavour (no CMOV/SSE; builds GCC with an i586 runtime first)
        run: LWJGL_X86_FLAVOUR=i586 ./build.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: lwjgl-${{ matrix.lwjgl }}-linux-x86-build.${{ github.run_number }}
        run: |
          # The jars keep one name per release; 3.4.3's are built into out/3.4.3/.
          jars=out
          [[ $LWJGL_VERSION == 3.4.1 ]] || jars=out/$LWJGL_VERSION
          files=($jars/lwjgl-natives-linux-x86.jar out/lwjgl-$LWJGL_VERSION-linux-x86.tar.gz $jars/lwjgl-$LWJGL_VERSION.jar
                 $jars/lwjgl-natives-linux-x86-i686.jar out/lwjgl-$LWJGL_VERSION-linux-x86-i686.tar.gz
                 $jars/lwjgl-natives-linux-x86-i586.jar out/lwjgl-$LWJGL_VERSION-linux-x86-i586.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=()
            [[ "$GITHUB_REF" == refs/heads/main ]] || prerelease=(--prerelease)
            gh release create "$TAG" "${files[@]}" "${prerelease[@]}" --target "$GITHUB_SHA" \
              --title "LWJGL $LWJGL_VERSION linux-x86, build ${{ github.run_number }}" \
              --notes "Built from \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}) by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Patched core jar \`lwjgl-$LWJGL_VERSION.jar\` (32-bit Java 25, see the README): sha1 \`$(sha1sum < $jars/lwjgl-$LWJGL_VERSION.jar | cut -c1-40)\`, size $(stat -c %s $jars/lwjgl-$LWJGL_VERSION.jar)."
          fi
