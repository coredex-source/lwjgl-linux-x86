name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86:
    name: LWJGL 3.4.1 natives, linux-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources (pinned commits + patches/)
        run: ./fetch.sh

      - name: Build container image
        run: podman build -t lwjgl-x86-build -f Containerfile .

      - name: Build natives
        run: ./build.sh

      - name: Build natives, i686 flavour (no SSE/SSE2)
        run: LWJGL_X86_FLAVOUR=i686 ./build.sh

      - name: Build natives, i586 flavour (no CMOV/SSE; builds GCC with an i586 runtime first)
        run: LWJGL_X86_FLAVOUR=i586 ./build.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: lwjgl-3.4.1-linux-x86-build.${{ github.run_number }}
        run: |
          files=(out/lwjgl-natives-linux-x86.jar out/lwjgl-3.4.1-linux-x86.tar.gz
                 out/lwjgl-natives-linux-x86-i686.jar out/lwjgl-3.4.1-linux-x86-i686.tar.gz
                 out/lwjgl-natives-linux-x86-i586.jar out/lwjgl-3.4.1-linux-x86-i586.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=()
            [[ "$GITHUB_REF" == refs/heads/main ]] || prerelease=(--prerelease)
            gh release create "$TAG" "${files[@]}" "${prerelease[@]}" --target "$GITHUB_SHA" \
              --title "LWJGL 3.4.1 linux-x86, build ${{ github.run_number }}" \
              --notes "Built from \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}) by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
